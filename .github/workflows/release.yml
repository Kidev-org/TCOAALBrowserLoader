name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without the leading v (e.g. 1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Validate the version
        id: v
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error title=Bad version::\"$VERSION\" is not a version. Pass 1.0.0, not v1.0.0."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # The three builds only make artifacts; `publish` puts them all on ONE
  # release, v<version>: the APK, the installer stubs with their stubs.json,
  # and the Microsoft Store package. The site deploys last, since it copies
  # /stub/ out of that release.
  stubs:
    needs: prepare
    uses: ./.github/workflows/deploy-stubs.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read
    secrets: inherit

  android:
    needs: prepare
    uses: ./.github/workflows/deploy-android.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read
    secrets: inherit

  publish:
    needs: [prepare, stubs, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download the Android APK
        uses: actions/download-artifact@v8.0.1
        with:
          name: app-release-apk
          path: dist

      # Already under their download names, with stubs.json naming them:
      # tools/build-mod.js reads releases/latest/download/stubs.json.
      - name: Download the installer stubs
        uses: actions/download-artifact@v8.0.1
        with:
          name: installer-stubs
          path: dist

      # The Microsoft Store package deploy-stubs.yml makes when the Partner
      # Center identity is configured: attached for upload in Partner Center.
      - name: Download the Microsoft Store package
        if: vars.MSSTORE_IDENTITY_NAME != ''
        uses: actions/download-artifact@v8.0.1
        with:
          name: store-msix
          path: store

      - name: Name the files after the release
        run: |
          mv dist/app-release.apk "dist/TCOAAL-Player-v${VERSION}.apk"
          if [ -f store/TCOAAL-Mod-Loader.msix ]; then
            mv store/TCOAAL-Mod-Loader.msix "dist/TCOAAL-Mod-Loader-v${VERSION}.msix"
          fi

      - name: Publish the release
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          files: dist/*
          fail_on_unmatched_files: true

  web:
    needs: [prepare, publish]
    uses: ./.github/workflows/deploy-web.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read
      pages: write
      id-token: write
    secrets: inherit
