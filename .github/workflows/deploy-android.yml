name: Deploy Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: "Release version"
        required: true
        type: string

# Builds the signed APK as the `app-release-apk` artifact. Publishing is
# release.yml's job: the APK is an asset of the version release (v<version>).
permissions:
  contents: read

jobs:
  build:
    name: Signed release APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # No "Gradle Build Results" job summary and no PR comment: the
          # build's own log is the record, like every other workflow here.
          add-job-summary: never
          add-job-summary-as-pr-comment: never

      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PversionName="${{ inputs.version }}" \
            -PversionCode="${{ github.run_number }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

