      /* Network status badge. In-game we only surface offline state inside

  <body>

    <div id="boot-error">

      <p id="err-desc">
        The game couldn't start. This is often caused by an incomplete import or
        a stale browser cache. Clearing the loaded data and re-importing usually
        fixes it.
      </p>
      <div class="err-msg" id="err-msg"></div>
      <div class="actions">
        <button class="danger" onclick="window.__bootClearAndReload(event)">
          Clear and reload
        </button>
        <button onclick="window.__bootShowReport()">Show report</button>
      </div>

        Show diagnostic info

      <div class="diag" id="err-diag"></div>

    <script>
      /**
       * Bootstrap: register SW, check for game files, load game scripts.
       *
       * On GitHub Pages the game files live in IndexedDB (imported via loader.html).
       * The Service Worker intercepts script requests and serves them from IDB.
       * We must ensure the SW is active BEFORE loading game scripts, otherwise
       * the <script> requests would 404 against the static host.
       */
      // Offline indicator wiring. Lives outside the main IIFE so it runs
      // even if the bootstrap below bails early (lock redirect, migration
      // redirect, fatal exception). Reflects navigator.onLine on boot and
      // toggles live on online/offline events.
      (function () {
        var el = document.getElementById("offline-indicator");
        if (!el) return;
        function apply(offline) {
          el.classList.toggle("visible", offline);
          el.setAttribute("aria-hidden", offline ? "false" : "true");
        }
        function probe() {
          var ctrl = new AbortController();
          var tid = setTimeout(function () { ctrl.abort(); }, 5000);
          fetch("/mods.json", { method: "HEAD", cache: "no-store", signal: ctrl.signal })
            .then(function (r) { clearTimeout(tid); apply(!r.ok); })
            .catch(function () { clearTimeout(tid); apply(true); });
        }
        function update() {
          if (navigator.onLine === false) { apply(true); return; }
          probe();
        }
        update();
        setInterval(probe, 30000);
        try {
          window.addEventListener("online", update);
          window.addEventListener("offline", update);
        } catch (e) {}
      })();

      (function () {
        "use strict";

        // Offline-cache kill switch.
        //
        // The Service Worker pre-caches the player's app shell so the game
        // boots without a network (game files already live in IDB). If that
        // cache ever serves a poisoned copy, the user can disable it by:
        //   - visiting /?offline=off (or /?offline=on to re-enable)
        //   - running __toggleOfflineCache(false) in the console
        //   - setting localStorage._offlineCacheDisabled = "1"
        //
        // The localStorage flag is the source of truth on the page side and
        // is mirrored to the SW via postMessage on every boot, so the SW
        // always knows whether to use the cache.
        (function () {
          function applyToSW(disabled, done) {
            try {
              if (
                "serviceWorker" in navigator &&
                navigator.serviceWorker.controller
              ) {
                var ch = new MessageChannel();
                ch.port1.onmessage = function () {
                  if (done) done();
                };
                navigator.serviceWorker.controller.postMessage(
                  { type: "setOfflineEnabled", enabled: !disabled },
                  [ch.port2],
                );
                // Also nudge any other registrations (waiting/installing).
                navigator.serviceWorker
                  .getRegistration()
                  .then(function (reg) {
                    if (
                      reg &&
                      reg.active &&
                      reg.active !== navigator.serviceWorker.controller
                    ) {
                      reg.active.postMessage({
                        type: "setOfflineEnabled",
                        enabled: !disabled,
                      });
                    }
                  })
                  .catch(function () {});
                // Safety timeout so we never hang the boot on a missing reply.
                setTimeout(function () {
                  if (done) {
                    var d = done;
                    done = null;
                    d();
                  }
                }, 1500);
              } else if (done) {
                done();
              }
            } catch (e) {
              if (done) done();
            }
          }

          // Expose a console-friendly toggle. Returns a promise so users can
          // `await __toggleOfflineCache(false)` and reload.
          window.__toggleOfflineCache = function (enabled) {
            var disabled = enabled === false;
            try {
              if (disabled) {
                localStorage.setItem("_offlineCacheDisabled", "1");
              } else {
                localStorage.removeItem("_offlineCacheDisabled");
              }
            } catch (e) {}
            return new Promise(function (resolve) {
              applyToSW(disabled, function () {
                resolve({ offlineDisabled: disabled });
              });
            });
          };

          // URL trigger: /?offline=off disables, /?offline=on re-enables.
          // Strip the param and reload so the rest of the bootstrap (lock
          // check, healthcheck, etc.) re-runs with the new state.
          try {
            var params = new URLSearchParams(location.search);
            var v = params.get("offline");
            if (v === "off" || v === "on") {
              var disabled = v === "off";
              try {
                if (disabled)
                  localStorage.setItem("_offlineCacheDisabled", "1");
                else localStorage.removeItem("_offlineCacheDisabled");
              } catch (e) {}
              applyToSW(disabled, function () {
                params.delete("offline");
                var qs = params.toString();
                location.replace(
                  location.pathname + (qs ? "?" + qs : "") + location.hash,
                );
              });
              return; // pause the rest of the bootstrap until the reload fires
            }
          } catch (e) {}

          // Normal boot path: mirror current flag to the SW (best-effort,
          // non-blocking). The SW also reads the flag from IDB on first use
          // so this message is purely a freshness signal.
          var storedDisabled = false;
          try {
            try {
              storedDisabled =
                localStorage.getItem("_offlineCacheDisabled") === "1";
            } catch (e) {}
            applyToSW(storedDisabled, null);
          } catch (e) {}

          // Full-shell revalidation. Per-request network-first already keeps
          // files the page loaded this visit in sync with remote, but it
          // can't refresh files the page never requests (loader.html when
          // we're on index, bg.webp, lock.html, ...). Ask the SW to re-fetch
          // every entry in APP_SHELL once the page is idle and the user is
          // online; the SW throttles this to once per 5 min so mashed
          // reloads don't redownload ~2 MB each time.
          //
          // Skipped entirely when the kill switch is on: there's no cache to
          // revalidate.
          if (!storedDisabled) {
            var sentRevalidate = false;
            function requestShellRevalidate() {
              if (sentRevalidate) return;
              if (!navigator.onLine) return;
              try {
                if (
                  "serviceWorker" in navigator &&
                  navigator.serviceWorker.controller
                ) {
                  navigator.serviceWorker.controller.postMessage({
                    type: "revalidateShell",
                  });
                  sentRevalidate = true;
                }
              } catch (e) {}
            }
            // Run when idle, with a hard timeout fallback. Also re-arm on
            // online/visibilitychange so a tab that boots offline picks up
            // a fresh shell the moment it comes back online.
            if ("requestIdleCallback" in window) {
              try {
                window.requestIdleCallback(requestShellRevalidate, {
                  timeout: 15000,
                });
              } catch (e) {
                setTimeout(requestShellRevalidate, 8000);
              }
            } else {
              setTimeout(requestShellRevalidate, 8000);
            }
            window.addEventListener("online", function () {
              sentRevalidate = false;
              requestShellRevalidate();
            });
            window.addEventListener("visibilitychange", function () {
              if (document.visibilityState === "visible") {
                // SW throttle handles dedupe; just nudge it.
                sentRevalidate = false;
                requestShellRevalidate();
              }
            });
          }
        })();

        // Site-wide lock check. /lock.json drives a maintenance / outage
        // screen at /lock.html; if enabled we redirect there before doing
        // anything else. Synchronous XHR is used so the splash never has
        // a chance to render the game UI. cache:no-store equivalent is
        // achieved with the cachebuster query: sync XHR doesn't honour
        // fetch options. Partial locks are short-circuited locally via
        // a localStorage mirror written by lock.html on dismiss, so a
        // user who already acknowledged isn't bounced through lock.html
        // on every load.
        try {
          var _lx = new XMLHttpRequest();
          _lx.open("GET", "/lock.json?_=" + Date.now(), false);
          _lx.send();
          if (_lx.status >= 200 && _lx.status < 300) {
            var _lock = JSON.parse(_lx.responseText);
            if (_lock && _lock.enabled) {
              var _id = _lock.id || "default";
              var _seen = null;
              if (_lock.type === "partial") {
                try {
                  _seen = localStorage.getItem("__lock_dismissed__:" + _id);
                } catch (_) {}
              }
              if (!_seen) {
                location.replace(
                  "/lock.html?return=" +
                    encodeURIComponent(location.pathname + location.search),
                );
                return;
              }
            }
          }
        } catch (_) {}

        // One-time translation-prefix save migration lives on its own page.
        // If any localStorage save key still carries a "translation_*:" prefix
        // we hand off to /migrate.html before doing anything else: that page
        // owns the backup-zip modal and the merge, and isn't fighting the
        // game's PIXI canvas / boot-splash / LOADING image for the screen.
        // location.replace keeps it out of session history.
        //
        // After a successful migration migrate.html sets the flag
        // `_migration_translation_done`. With that flag present we never
        // redirect again: any straggler translation_<id>:* key is silently
        // dropped (it can only be an orphan that slipped past the merge's
        // sweep: it would otherwise re-trigger this redirect on every
        // boot, which is exactly the regression the flag is here to stop).
        try {
          var _migrationDone = false;
          try {
            _migrationDone = !!localStorage.getItem(
              "_migration_translation_done",
            );
          } catch (_) {}
          var _stragglers = [];
          var _needsMigrate = false;
          for (var _mi = 0; _mi < localStorage.length; _mi++) {
            var _mk = localStorage.key(_mi);
            if (typeof _mk !== "string") continue;
            if (!/^translation_[^:]+:/.test(_mk)) continue;
            _stragglers.push(_mk);
            if (
              !_migrationDone &&
              /^translation_[^:]+:RPG (?:File\d+(?:bak)?|Global|Config)$/.test(
                _mk,
              )
            ) {
              _needsMigrate = true;
            }
          }
          if (_needsMigrate) {
            location.replace("/migrate.html");
            return;
          }
          if (_migrationDone && _stragglers.length > 0) {
            for (var _si = 0; _si < _stragglers.length; _si++) {
              try {
                localStorage.removeItem(_stragglers[_si]);
              } catch (_) {}
            }
            // Mirror the LS purge into tcoaal-saves so a future
            // restoreSavesFromIDB pass can't bring the stragglers back.
            // Best-effort and async: failures are silently ignored, since
            // the LS purge above already addresses the user-visible symptom
            // (the loader export reads LS only).
            try {
              var _sReq = indexedDB.open("tcoaal-saves", 1);
              _sReq.onupgradeneeded = function (e) {
                try {
                  e.target.result.createObjectStore("saves");
                } catch (_) {}
              };
              _sReq.onsuccess = function (e) {
                var _db = e.target.result;
                _openIdbConns.push(_db);
                try {
                  var _rtx = _db.transaction("saves", "readonly");
                  var _kr = _rtx.objectStore("saves").getAllKeys();
                  _kr.onsuccess = function () {
                    var _keys = _kr.result || [];
                    var _doom = [];
                    for (var _ki = 0; _ki < _keys.length; _ki++) {
                      var _ik = _keys[_ki];
                      if (
                        typeof _ik === "string" &&
                        /^translation_[^:]+:/.test(_ik)
                      ) {
                        _doom.push(_ik);
                      }
                    }
                    if (_doom.length === 0) return;
                    try {
                      var _wtx = _db.transaction("saves", "readwrite");
                      var _st = _wtx.objectStore("saves");
                      for (var _di = 0; _di < _doom.length; _di++) {
                        try {
                          _st.delete(_doom[_di]);
                        } catch (_) {}
                      }
                    } catch (_) {}
                  };
                } catch (_) {}
              };
            } catch (_) {}
          }
        } catch (_) {}

        var DB_NAME = "tcoaal";
        var DB_VERSION = 1;
        var STORE_NAME = "assets";
        var SAVE_DB_NAME = "tcoaal-saves";
        var TRANSLATIONS_DB_NAME = "tcoaal-translations";
        var CLD_KEY = "data/9c7050ae76645487";
        var LANG_CACHE_KEY = "__lang_data__";
        // Pre-remaster builds store their languages/<lang>/dialogue.loc verbatim
        // and record its path here; the .loc is parsed on the fly (loadOldCld).
        var OLD_CLD_PATH_KEY = "__old_cld_path__";
        var K9A_LOC_SIG = "00000NEMLEI00000";
        // Mirrors loader.html's SAVE_KEY_RE exactly, keep both in sync.
        var SAVE_KEY_RE = /(?:^|:)RPG (?:File\d+|Global|Config|Auto\d+)$/;
        // API-count bookkeeping: lang-shim's _countedMods / backfill tries, and
        // achievements-shim's _achvPlayerCounted / _achvReported. These guard
        // against re-counting an install, a player or an achievement to the
        // API, so our own "Clear browser data" buttons must NEVER erase them -
        // not even on a full ctrl/cmd+click wipe. The only sanctioned reset is
        // the browser's native site-data controls. Mirrors loader.html's copy,
        // keep in sync.
        var INSTALL_FLAG_RE =
          /^_(?:countedMods|countBackfillTries|achvPlayerCounted|achvReported)$/;

        // Every IndexedDB connection this page opens is tracked here so the
        // clear-and-reload flow can close them first. An open connection
        // blocks `deleteDatabase` (it fires `onblocked` and never completes),
        // which is what left the recovery button frozen on "Clearing...".
        var _openIdbConns = [];

        var splash = document.getElementById("boot-splash");
        var errOverlay = document.getElementById("boot-error");
        var errTitle = document.getElementById("err-title");
        var errDesc = document.getElementById("err-desc");
        var errMsg = document.getElementById("err-msg");
        var errDiag = document.getElementById("err-diag");

        var bootPhase = "init";
        var bootDone = false;

        function setSplash(msg) {
          splash.textContent = msg;
        }

        function setPhase(name, label) {
          bootPhase = name;
          setSplash(label);
        }

        function buildDiagnostics(err) {
          var lines = [];
          lines.push("Phase: " + bootPhase);
          lines.push("UA: " + (navigator.userAgent || "?"));
          lines.push("URL: " + location.href);
          lines.push(
            "SW: " +
              ("serviceWorker" in navigator

        // resolves but the DB isn't actually gone, so loader.html reads
        // back stale (or partially-deleted) keys and bounces straight back

        //   1) unregister the SW (releases its IDB handle)
        //   2) clear caches

              };
              req.onerror = function () {
                resolve(null);
              };
            } catch (e) {
              resolve(null);
            }

              req.onerror = resolve;
            } catch (e) {
              resolve();
            }

              req.onerror = resolve;
            } catch (e) {
              resolve();
            }

          return new Promise(function (resolve) {
            try {

              req.onerror = function () {
                resolve([]);
              };

              resolve([]);

            JSON.parse(jsonStr);
            return jsonStr;
          } catch (e) {
            return null;
          }
        }

        // Old build: parse a NEMLEI-wrapped (or plain-JSON) .loc buffer to its
        // JSON text. Mirrors loader.html/sw.js parseLocText().
        function parseLocText(buf) {
          var bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
          var sig = new TextDecoder("latin1").decode(
            bytes.subarray(0, K9A_LOC_SIG.length),
          );
          if (bytes.length >= K9A_LOC_SIG.length + 4 && sig === K9A_LOC_SIG) {
            var off = K9A_LOC_SIG.length;
            var view = new DataView(
              bytes.buffer,
              bytes.byteOffset,
              bytes.byteLength,
            );
            var len = view.getUint32(off, true);
            return new TextDecoder("utf-8").decode(
              bytes.subarray(off + 4, off + 4 + len),
            );
          }
          return new TextDecoder("utf-8").decode(bytes);
        }

        // Old build: read the .loc named by OLD_CLD_PATH_KEY and parse it to a
        // JSON string on the fly (no plain script stored at rest). Resolves to
        // the string, or null.
        function loadOldCldInline(db) {
          return idbGet(db, OLD_CLD_PATH_KEY).then(function (cldPath) {
            if (!cldPath || typeof cldPath !== "string") return null;
            return idbGet(db, cldPath).then(function (raw) {
              if (!raw) return null;
              function done(ab) {
                try {
                  var text = parseLocText(ab);
                  JSON.parse(text);
                  return text;
                } catch (e) {
                  return null;
                }
              }
              if (raw instanceof Blob) return raw.arrayBuffer().then(done);
              return done(raw);
            });
          });
        }

        // Preload language data into a global so browser-shim.js can serve it
        // synchronously to the DRM payload.
        //
        // When a mod is active the CLD served to the DRM must be the MERGE of
        // base + mod data: the mod's own CSV-parsed data is missing required
        // CLD fields. The SW implements that merge on /lang-data.json, so we
        // fetch through it instead of reading IDB directly.
        //
        // Without an active mod we prefer __lang_data__ in IDB (fastest), then
        // fall back to decrypting the encrypted CLD ourselves (no SW needed),
        // then finally /lang-data.json. The middle step is critical on mobile
        // where the SW can be slow to claim.
        function preloadLangData(db, files) {
          var activeMod = null;
          var activeLang = null;
          try {
            activeMod = localStorage.getItem("_activeMod") || null;
            activeLang = localStorage.getItem("_activeLang") || null;
          } catch (e) {}

          function fromLangDataJson() {
            return fetch("/lang-data.json", { cache: "no-store" })
              .then(function (res) {
                return res.ok ? res.text() : null;
              })
              .then(function (text) {
                if (text && typeof text === "string") {
                  window.__langData = text;
                }
              })
              .catch(function () {});
          }

          if (activeMod || activeLang) {
            // An overhaul and/or a translation overlay is active: the SW
            // produces the layered merge (base -> overhaul -> translation) on
            // /lang-data.json, so always go through it rather than reading a
            // single IDB blob.
            return fromLangDataJson();
          }

          // 1. Pre-extracted JSON in IDB (fastest, no SW required).
          if (files && files.hasLangCache) {
            return idbGet(db, LANG_CACHE_KEY).then(function (data) {
              if (data && typeof data === "string") {
                window.__langData = data;
                return;
              }
              // unexpected type -> fall through
              return decryptInline();
            });
          }

          // 1b. Old build: parse the .loc inline (no SW required), same as the
          //     remaster's inline CLD decrypt below. Falls back to the SW route.
          if (files && files.hasOldCld) {
            return loadOldCldInline(db).then(function (json) {
              if (json) {
                window.__langData = json;
                return;
              }
              return fromLangDataJson();
            });
          }

          // 2. Decrypt the CLD inline (no SW required).
          function decryptInline() {
            if (!files || !files.hasEncryptedCld) return fromLangDataJson();
            return idbGet(db, CLD_KEY).then(function (raw) {
              if (!raw) return fromLangDataJson();
              var maybePromise = extractLangFromCld(raw);
              if (maybePromise && typeof maybePromise.then === "function") {
                return maybePromise.then(function (json) {
                  if (json) {
                    // Decoded into memory for browser-shim to serve the DRM
                    // synchronously; NOT written back to IDB. The encrypted
                    // CLD stays the only at-rest copy, decoded on the fly each
                    // boot (keeps the plain script out of IDB).
                    window.__langData = json;
                    return;
                  }
                  return fromLangDataJson();
                });
              }
              if (maybePromise) {
                window.__langData = maybePromise;
                return;
              }
              return fromLangDataJson();
            });
          }

          return decryptInline();
        }

        // Preload /mods.json into window.__modsDataJson so lang-shim.js's
        // synchronous XHR has a working fallback when the SW couldn't (or
        // didn't yet) intercept the request: first visit before SW claim,
        // ensureSW's 3 s timeout firing, or an empty SHELL_CACHE / IDB
        // fallback after a SW version bump while offline.
        //
        // Resolution order:
        //   1. fetch(/mods.json) goes through the SW (which has its own
        //      network-first + SHELL_CACHE + IDB fallback chain); also handles
        //      the no-controller case where the fetch goes straight to network.
        //   2. Direct IDB read of "__shell:mods.json__" (the same key the SW
        //      writes to on every successful fetch). Survives an SW that never
        //      controlled the page (e.g. user offline since first install).
        //
        // On a successful resolve we also mirror the text back into IDB so
        // a future offline boot finds it even if the SW never intercepts.
        // mod-related logic in lang-shim.js (mod menu, loadActivePlugins,
        // install/uninstall) all key off _modsData, so making this resilient
        // is what keeps plugins and the Mods scene working offline.
        var MODS_JSON_IDB_KEY = "__shell:mods.json__";

        function preloadModsData(db) {
          function stashAndPersist(text) {
            if (!text || typeof text !== "string") return false;
            try {
              var parsed = JSON.parse(text);
              if (!parsed || typeof parsed !== "object") return false;
              window.__modsDataJson = text;
              if (db) idbPut(db, MODS_JSON_IDB_KEY, text);
              return true;
            } catch (e) {
              return false;
            }
          }

          return fetch("/mods.json", { cache: "no-store" })
            .then(function (res) {
              return res && res.ok ? res.text() : null;
            })
            .catch(function () {
              return null;
            })
            .then(function (text) {
              if (stashAndPersist(text)) return;
              if (!db) return;
              return idbGet(db, MODS_JSON_IDB_KEY).then(function (cached) {
                if (cached && typeof cached === "string")
                  stashAndPersist(cached);
              });
            });
        }

        //
        // A returning user may have a translation installed that this app
        // update improved the parser for (LANG_PARSE_VERSION bump in
        // lang-format.js), or whose content the translations server has
        // revved. lang-shim.js's background sync only applies on the NEXT
        // launch, so the reconnecting launch would still show stale text
        // (e.g. untranslated choices). We detect it here, BEFORE
        // preloadLangData reads the merged CLD, show the loading image, apply
        // the fix to IDB, and reload so the engine boots once with correct
        // text. Scope: the ACTIVE translation only (bounded, usually a fast
        // local re-parse); every other language stays on lang-shim's lazy
        // background sync.

        function showUpdateSplash(msg) {
          try {
            splash.classList.remove("hidden");
            splash.innerHTML =
              '<div style="display:flex;flex-direction:column;' +
              'align-items:center;gap:18px;padding:24px;box-sizing:border-box">' +
              '<img src="/img/loading.png" alt="Loading" ' +
              'style="max-width:70vw;max-height:45vh;object-fit:contain" />' +
              "<div>" +
              (msg || "Updating translation...") +
              "</div></div>";
          } catch (e) {}
        }

        // Rebuild the cached CLD (__mod_lang_data__) from the langFile already
        // in IDB, using the same format handling as lang-shim.js's
        // extractModLangData: .csv/.txt go through the shared parser, .loc/.json
        // (and "LANGDATA"-prefixed CLDs) are JSON with any leading padding
        // stripped. No network. Returns true on success.
        function extractTranslationCache(db, id, entry) {
          var langFile = entry.langFile;
          return idbGet(db, "mod:" + id + ":" + langFile).then(function (raw) {
            if (raw == null) return false;
            var text =
              typeof raw === "string" ? raw : new TextDecoder().decode(raw);
            var LF = window.LangFormat;
            var parsed, json;
            if (/\.csv$/i.test(langFile)) {
              parsed = LF.parseDialogueCsv(text);
              json = JSON.stringify(parsed);
            } else if (/\.txt$/i.test(langFile)) {
              parsed = LF.parseDialogueTxt(text);
              json = JSON.stringify(parsed);
            } else {
              json = text.trim();
              var s = json.indexOf("{");
              if (s > 0) json = json.substring(s);
              try {
                parsed = JSON.parse(json);
              } catch (e) {
                return false;
              }
            }
            if (
              !parsed ||
              (!parsed.linesLUT && !parsed.labelLUT && !parsed.sysMenus)
            )
              return false;
            return idbPut(db, "__mod_lang_data__:" + id, json).then(
              function () {
                return true;
              },
            );
          });
        }

        // Re-fetch every file of a (remote) translation into IDB. Returns true
        // only when every file stored OK, so a partial download never
        // half-replaces a working translation.
        function downloadTranslation(db, id, entry) {
          var base = String(entry.path || "").replace(/\/$/, "") + "/";
          var files = entry.files || [];
          if (!files.length) return Promise.resolve(false);
          var ok = true;
          var chain = Promise.resolve();
          files.forEach(function (rel) {
            chain = chain.then(function () {
              if (!ok) return;
              return fetch(base + rel)
                .then(function (res) {
                  if (!res.ok) throw new Error(String(res.status));
                  return res.arrayBuffer();
                })
                .then(function (buf) {
                  return idbPut(db, "mod:" + id + ":" + rel, buf);
                })
                .catch(function () {
                  ok = false;
                });
            });
          });
          return chain.then(function () {
            return ok;
          });
        }

        function ensureActiveTranslationFresh(ctx) {
          var db = ctx && ctx.db;
          if (!db || !window.indexedDB) return Promise.resolve();
          var activeLang = null;
          try {
            activeLang = localStorage.getItem("_activeLang") || null;
          } catch (e) {}
          if (!activeLang) return Promise.resolve();

          var modsData = null;
          try {
            modsData = JSON.parse(window.__modsDataJson || "null");
          } catch (e) {}
          var entry = modsData && modsData[activeLang];
          if (!entry || entry.type !== "translation" || !entry.langFile)
            return Promise.resolve();

          return Promise.all([
            idbGet(db, "__mod_meta__:" + activeLang),
            idbGetAllKeys(db, "mod:" + activeLang + ":"),
          ]).then(function (res) {
            var rawMeta = res[0];
            var modKeys = res[1] || [];
            {
              if (rawMeta == null) return; // not installed -> nothing to refresh
              var meta = {};
              try {
                meta =
                  typeof rawMeta === "string" ? JSON.parse(rawMeta) : rawMeta;
              } catch (e) {
                meta = {};
              }

              var curVer = entry.version || "";
              var versionOk = !curVer || meta.version === curVer;
              var canReparse = /\.(csv|txt)$/i.test(entry.langFile);

              // A translation installed from an older/partial manifest can be
              // missing files even when its version matches (the same broken
              // state overhauls hit). Detect it so the re-download path below
              // also fires for a mere gap, not only a version bump.
              var have = {};
              var pfx = "mod:" + activeLang + ":";
              for (var mk = 0; mk < modKeys.length; mk++)
                have[String(modKeys[mk]).substring(pfx.length)] = 1;
              var filesMissing = false;
              var tfiles = entry.files || [];
              for (var tf = 0; tf < tfiles.length; tf++) {
                if (!have[tfiles[tf]]) {
                  filesMissing = true;
                  break;
                }
              }

              // Fast exit: version current, nothing missing, AND not a locally
              // re-parsable format (e.g. a .loc translation) -> nothing to do.
              if (versionOk && !filesMissing && !canReparse) return;

              // Judging parse-staleness needs LANG_PARSE_VERSION, and applying
              // either fix needs the parser itself; both live in lang-format.js.
              // It's in GAME_SCRIPTS but loads later, so pull it in now. Only
              // reached for an installed active translation, so users without a
              // translation never load it on the boot path.
              var ensureLF = window.LangFormat
                ? Promise.resolve()
                : loadScripts(["js/libs/lang-format.js"], 0).catch(
                    function () {},
                  );

              return ensureLF.then(function () {
                if (!window.LangFormat) return; // couldn't load -> leave to bg sync
                var parseVer = window.LangFormat.LANG_PARSE_VERSION;
                var parseStale =
                  canReparse && (meta.langParseVersion || 0) < parseVer;
                if (versionOk && !filesMissing && !parseStale) return; // fresh

                // Loop guard: only the reload path (below) sets this; it stops a
                // reload-requiring update that never "sticks" from looping.
                var GUARD = "__langUpdateTried:" + activeLang;
                try {
                  if (sessionStorage.getItem(GUARD) === "1") return;
                } catch (e) {}

                // Missing files can only be refilled from the network; a plain
                // parse-refresh cannot, so a gap forces a download too.
                var needsDownload = !versionOk || filesMissing;
                // A re-download needs the network; a local re-parse does not.
                if (needsDownload && navigator.onLine === false) return;

                showUpdateSplash();

                var work;
                if (needsDownload) {
                  work = downloadTranslation(db, activeLang, entry).then(
                    function (downloaded) {
                      if (!downloaded) return false;
                      var newMeta = {
                        version: entry.version || "",
                        date: new Date().toISOString().substring(0, 10),
                        files: (entry.files || []).length,
                        langParseVersion: parseVer,
                      };
                      return idbPut(
                        db,
                        "__mod_meta__:" + activeLang,
                        JSON.stringify(newMeta),
                      ).then(function () {
                        return extractTranslationCache(db, activeLang, entry);
                      });
                    },
                  );
                } else {
                  work = extractTranslationCache(db, activeLang, entry).then(
                    function (reparsed) {
                      if (!reparsed) return false;
                      meta.langParseVersion = parseVer;
                      return idbPut(
                        db,
                        "__mod_meta__:" + activeLang,
                        JSON.stringify(meta),
                      ).then(function () {
                        return true;
                      });
                    },
                  );
                }
                return work.then(function (result) {
                  // result === false   -> update failed; continue with the stale
                  //   data (lang-shim's background sync retries it next launch).
                  // result truthy       -> applied to IDB in-place. preloadLangData
                  //   runs right after this and reads the corrected
                  //   /lang-data.json, so NO restart is needed.
                  // result === "reload" -> applied, but the change can only take
                  //   effect on a fresh boot. No action needs this today; it is
                  //   the escape hatch for a future preload step that mutates
                  //   something already consumed earlier in this boot (e.g. the
                  //   SW's active-state read). Such an action returns "reload".
                  if (result === "reload") {
                    try {
                      sessionStorage.setItem(GUARD, "1");
                    } catch (e) {}
                    location.reload();
                    return new Promise(function () {}); // halt this boot
                  }
                });
              });
            }
          });
        }

        // Repair active mods whose stored file set is incomplete. A mod
        // installed from an older manifest -- before missing files were added
        // back to the source -- is missing those files in IDB, leaving it
        // broken with no in-menu fix short of uninstall/reinstall. On boot, for
        // every ACTIVE installed overhaul and plugin, diff the manifest file
        // list against the "mod:{id}:" keys in IDB and, if any are missing,
        // show the loading splash and fetch just those files (per-file, same
        // URL layout as installMod) before the menu appears. Best-effort:
        // offline, or a fetch that fails, leaves the mod as-is and boot
        // continues; the next online launch retries. Only once every missing
        // file is stored is the mod's meta advanced to the manifest version, so
        // a partial repair never marks the mod current. Active translations are
        // handled by ensureActiveTranslationFresh (it re-extracts the CLD
        // cache too); this covers overhauls + plugins, which have no path.
        function ensureActiveModsComplete(ctx) {
          var db = ctx && ctx.db;
          if (!db || !window.indexedDB) return Promise.resolve();
          if (navigator.onLine === false) return Promise.resolve();

          var modsData = null;
          try {
            modsData = JSON.parse(window.__modsDataJson || "null");
          } catch (e) {}
          if (!modsData) return Promise.resolve();

          // Everything active this session: the overhaul in _activeMod plus
          // every plugin in _activePlugins, deduplicated.
          var ids = [];
          function pushId(id) {
            if (id && ids.indexOf(id) < 0) ids.push(id);
          }
          try {
            pushId(localStorage.getItem("_activeMod") || null);
          } catch (e) {}
          try {
            var rawP = localStorage.getItem("_activePlugins");
            if (rawP) {
              var arr = JSON.parse(rawP);
              if (Array.isArray(arr)) arr.forEach(pushId);
            }
          } catch (e) {}
          if (!ids.length) return Promise.resolve();

          // Build the repair list: {id, entry, missing[]} for each active,
          // installed mod with manifest files absent from IDB.
          var repairs = [];
          var scan = Promise.resolve();
          ids.forEach(function (id) {
            scan = scan.then(function () {
              var entry = modsData[id];
              var files = entry && entry.files;
              if (!entry || !files || !files.length) return;
              // A remote translation has its own repair path; skip it here.
              if (entry.type === "translation") return;
              return idbGet(db, "__mod_meta__:" + id).then(function (rawMeta) {
                if (rawMeta == null) return; // not installed -> skip
                return idbGetAllKeys(db, "mod:" + id + ":").then(
                  function (keys) {
                    var have = {};
                    var plen = ("mod:" + id + ":").length;
                    for (var k = 0; k < keys.length; k++)
                      have[String(keys[k]).substring(plen)] = 1;
                    var missing = [];
                    for (var f = 0; f < files.length; f++)
                      if (!have[files[f]]) missing.push(files[f]);
                    if (missing.length)
                      repairs.push({ id: id, entry: entry, missing: missing });
                  },
                );
              });
            });
          });

          return scan.then(function () {
            if (!repairs.length) return;

            showUpdateSplash("Updating mods...");

            // Repair each mod in turn. wwwBase mirrors installMod: a remote
            // (absolute-URL) path serves files directly; a local path keeps the
            // www/ layout under /{path}/www/.
            var chain = Promise.resolve();
            repairs.forEach(function (r) {
              chain = chain.then(function () {
                var path = String(r.entry.path || "").replace(/\/$/, "");
                var isRemote = /^https?:\/\//i.test(path);
                var base = isRemote ? path + "/" : "/" + path + "/www/";
                var ok = true;
                var sub = Promise.resolve();
                r.missing.forEach(function (rel) {
                  sub = sub.then(function () {
                    if (!ok) return;
                    return fetch(base + rel)
                      .then(function (res) {
                        if (!res.ok) throw new Error(String(res.status));
                        return res.arrayBuffer();
                      })
                      .then(function (buf) {
                        return idbPut(db, "mod:" + r.id + ":" + rel, buf);
                      })
                      .catch(function () {
                        ok = false;
                      });
                  });
                });
                return sub.then(function () {
                  if (!ok) return; // partial: keep stale meta, retry next time
                  // Every missing file is now stored. Advance the mod's meta to
                  // the current manifest version and file count so the repair
                  // sticks, preserving other meta fields (e.g. langParseVer).
                  return idbGet(db, "__mod_meta__:" + r.id).then(
                    function (rawMeta) {
                      var meta = {};
                      try {
                        meta =
                          typeof rawMeta === "string"
                            ? JSON.parse(rawMeta)
                            : rawMeta || {};
                      } catch (e) {
                        meta = {};
                      }
                      meta.version = r.entry.version || meta.version || "";
                      meta.files = (r.entry.files || []).length;
                      meta.date = new Date().toISOString().substring(0, 10);
                      return idbPut(
                        db,
                        "__mod_meta__:" + r.id,
                        JSON.stringify(meta),
                      );
                    },
                  );
                });
              });
            });
            return chain;
          });
        }

        // Step 2c: load favicon from IDB (icon/icon.png from the user's game files)
        function loadFavicon(db) {
          idbGet(db, "icon/icon.png").then(function (data) {
            if (!data) return;
            try {
              var blob =
                data instanceof Blob
                  ? data
                  : new Blob([data], { type: "image/png" });
              var url = URL.createObjectURL(blob);
              var fav = document.getElementById("favicon");
              var apple = document.getElementById("apple-icon");
              if (fav) {
                fav.href = url;
                fav.type = "image/png";
              }
              if (apple) apple.href = url;
            } catch (e) {}
          });
        }

        // Step 3: dynamically load game scripts in order.
        // A failed load is reported (not silently swallowed): the engine
        // can't recover from a missing rpg_core.js or browser-shim.js.
        function loadScripts(urls, idx) {
          if (idx >= urls.length) return Promise.resolve();
          return new Promise(function (resolve, reject) {
            var s = document.createElement("script");
            s.type = "text/javascript";
            s.src = urls[idx];
            s.onload = function () {
              loadScripts(urls, idx + 1)
                .then(resolve)
                .catch(reject);
            };
            s.onerror = function () {
              reject(new Error("Failed to load script: " + urls[idx]));
            };
            document.body.appendChild(s);
          });
        }

        // Game script order mirrors the original static <script> tags
        var GAME_SCRIPTS = [
          "js/libs/pixi.js",
          "js/libs/pixi-tilemap.js",
          "js/libs/pixi-picture.js",
          "js/libs/fpsmeter.js",
          "js/libs/lz-string.js",
          "js/libs/iphone-inline-video.browser.js",
          "js/rpg_core.js",
          "js/libs/pako_inflate.min.js",
          "js/libs/browser-shim.js",
          "js/rpg_managers.js",
          "js/rpg_objects.js",
          "js/rpg_scenes.js",
          "js/rpg_sprites.js",
          "js/rpg_windows.js",
          "js/plugins.js",
          "js/libs/lang-format.js",
          "js/libs/lang-shim.js",
          "js/libs/achievements-shim.js",
          "js/main.js",
        ];

        // Boot sequence
        setPhase("init", "Initializing...");

        // Defensively re-assert persistent storage on every boot. The loader
        // requests it at import time, but installs imported before that change
        // (or where the first request was denied and engagement has since
        // risen) get upgraded here so the game files aren't evicted under
        // storage pressure. Fire-and-forget: never gates boot.
        try {
          if (navigator.storage && navigator.storage.persist) {
            navigator.storage
              .persisted()
              .then(function (already) {
                if (!already) return navigator.storage.persist();
                return true;
              })
              .catch(function () {});
          }
        } catch (e) {}

        ensureSW()
          .then(function () {
            setPhase("check-files", "Checking game files...");
            // Open IDB. If this throws we likely have a private/locked
            // storage situation: still try server.js mode.
            return idbOpen().then(
              function (db) {
                return { db: db };
              },
              function () {
                return { db: null };
              },
            );
          })
          .then(function (ctx) {
            var db = ctx.db;
            if (!db) {
              return checkServer().then(function (ok) {
                if (!ok) {
                  // No IDB and no server, send to loader.
                  location.replace("/loader.html");
                  return null;
                }
                return { db: null, files: null, server: true };
              });
            }
            return migrateLegacyDecoded(db).then(function (mig) {
              // Legacy decoded old build: already wiped + redirected to loader.
              if (mig === "reimport") return null;
              return checkGameFiles(db).then(function (files) {
                if (!files.hasCore) {
                // Maybe server.js mode (no IDB import).
                return checkServer().then(function (ok) {
                  if (ok) return { db: db, files: null, server: true };
                  // Nothing to play: send back to import flow.
                  location.replace("/loader.html");
                  return null;
                });
              }
              if (!files.hasAnyLang) {
                // Critical files imported but the language file is missing.
                // The DRM cannot start without it. Surface a clear error
                // so the user can clear and re-import.
                showError(
                  "Required game data missing",
                  "The language data file (data/9c7050ae76645487) wasn't " +
                    "found in the imported game. The game can't start " +
                    "without it. Re-import your full game folder.",
                  new Error(
                    "Missing CLD: neither __lang_data__ nor " +
                      CLD_KEY +
                      " is present in IndexedDB.",
                  ),
                );
                return null;
              }
              // Manifest healthcheck: if files are missing, send the user
              // to /loader.html (manage UI shows the report + a Play
              // button so they can still launch if they want).
              // Skip when the user has already acknowledged the missing
              // files via the loader's Play button: otherwise we'd loop
              // them right back here on every navigation.
              var acknowledged = false;
              try {
                acknowledged =
                  localStorage.getItem("_healthcheckAcknowledged") === "1";
              } catch (e) {}
              if (acknowledged) return { db: db, files: files, server: false };
              return healthcheckOk(db).then(function (ok) {
                if (!ok) {
                  location.replace("/loader.html");
                  return null;
                }
                return { db: db, files: files, server: false };
              });
              });
            });
          })
          .then(function (ctx) {
            if (!ctx) return; // already handled (redirect or error)

            // Game files are available and SW is active, load the game
            setPhase("preload", "Preparing language data...");

            // Preload language data and favicon (favicon is non-blocking).
            if (ctx.db) loadFavicon(ctx.db);

            // Order matters: load mods.json first (the freshness gates read
            // it), then repair any incomplete active mods and refresh the
            // active translation BEFORE the language data is read, then preload
            // the now-current language data.
            return preloadModsData(ctx.db)
              .then(function () {
                return ensureActiveModsComplete(ctx);
              })
              .then(function () {
                return ensureActiveTranslationFresh(ctx);
              })
              .then(function () {
                return preloadLangData(ctx.db, ctx.files);
              })
              .then(function () {
                // If we still don't have language data and there's no active
                // mod, fail loudly: the DRM will produce cryptic errors
                // ("Cannot create property imageLUT on string ''", etc.) if
                // we let it run without it.
                var activeMod = null;
                try {
                  activeMod = localStorage.getItem("_activeMod") || null;
                } catch (e) {}
                if (!activeMod && !window.__langData) {
                  showError(
                    "Language data unavailable",
                    "The game's language data couldn't be decoded. This " +
                      "usually means the import was incomplete. Clearing " +
                      "and re-importing the game folder fixes it.",
                    new Error("__langData empty after preload"),
                  );
                  return null;
                }

                setPhase("load-scripts", "Starting game...");

                // Load the font CSS first (it may also be in IDB)
                var link = document.createElement("link");
                link.rel = "stylesheet";
                link.type = "text/css";
                link.href = "fonts/gamefont.css";
                document.head.appendChild(link);

                // Intercept the onload handler that main.js will set
                // window.onload already fired so a plain assignment would
                // never trigger. We capture it and call it ourselves once
                // all plugin scripts have loaded.
                var _bootOnload = null;
                Object.defineProperty(window, "onload", {
                  set: function (fn) {
                    _bootOnload = fn;
                  },
                  get: function () {
                    return _bootOnload;
                  },
                  configurable: true,
                });

                return loadScripts(GAME_SCRIPTS, 0).then(function () {
                  setPhase("plugins", "Loading game plugins...");
                  // Hide the splash
                  splash.classList.add("hidden");
                  setTimeout(function () {
                    splash.remove();
                  }, 400);

                  // main.js called PluginManager.setup($plugins). The
                  // hardened loader in lang-shim.js fetches every plugin
                  // source in parallel and exposes window.__pluginsLoaded
                  // as a Promise that resolves once every plugin has been
                  // injected as an inline <script>. Wait on it so we don't
                  // boot before plugins (incl. the DRM payload) execute.
                  // Falls back to a resolved Promise when the hardened
                  // loader is absent (no behavioural change in that case).
                  return Promise.resolve(window.__pluginsLoaded).then(
                    function () {
                      bootAfterPlugins();
                    },
                  );

                  function bootAfterPlugins() {
                    // Finish boot: apply browser overrides then start game.
                    function finishBoot() {
                      setPhase("apply-overrides", "Applying overrides...");
                      // Apply browser overrides for non-zlib DRM types
                      // (deobfuscated.js, GameCode.js, etc.). For zlib DRM,
                      // the overrides were already applied via inflateSync
                      // but __applyBrowserOverrides is idempotent.
                      if (window.__applyBrowserOverrides)
                        window.__applyBrowserOverrides();

                      // Hook lang-shim into Scene_Boot AFTER DRM payload
                      // has loaded (it overwrites Scene_Boot.prototype.start)
                      if (window.__langShimHookBoot)
                        window.__langShimHookBoot();
                      if (window.__achvShimHookBoot)
                        window.__achvShimHookBoot();
                      delete window.onload;
                      bootDone = true;

                      function startScene() {
                        if (_bootOnload) {
                          _bootOnload();
                        } else if (typeof SceneManager !== "undefined") {
                          SceneManager.run(Scene_Boot);
                        }
                      }

                      // The DRM payload wraps SceneManager.run to call
                      // DataManager.init() synchronously, which enumerates
                      // auto*.rpgsave keys from localStorage to rebuild the
                      // globalInfo autoSaves dict. For overhaul mods the
                      // keys live under "<modId>:RPG Auto<ts>"; if they
                      // haven't been restored from IDB yet (LS eviction),
                      // the cleanup loop sees an empty directory and wipes
                      // the dict, making autosaves vanish from the load
                      // menu even though they persist in IDB. Block boot
                      // until lang-shim signals restoration is complete.
                      if (window.__langShimSavesReady) {
                        Promise.resolve(window.__langShimSavesReady).then(
                          startScene,
                        );
                      } else {
                        startScene();
                      }
                    }

                    // Some mods load game code via async <script> tags
                    // (e.g. deobfuscated.js injected by _()), which may not
                    // have executed yet. Detect and wait for them before
                    // applying overrides and booting the game.
                    var pendingGameCode = null;
                    var scripts = document.getElementsByTagName("script");
                    for (var si = 0; si < scripts.length; si++) {
                      var src = scripts[si].getAttribute("src") || "";
                      if (
                        src.indexOf("deobfuscated") >= 0 ||
                        src.indexOf("GameCode") >= 0
                      ) {
                        // Check if game globals exist (script already ran)
                        if (
                          typeof Lang === "undefined" &&
                          typeof App === "undefined"
                        ) {
                          pendingGameCode = scripts[si];
                        }
                        break;
                      }
                    }

                    if (pendingGameCode) {
                      var _booted = false;
                      function onceDone() {
                        if (_booted) return;
                        _booted = true;
                        finishBoot();
                      }
                      pendingGameCode.addEventListener("load", onceDone);
                      pendingGameCode.addEventListener("error", onceDone);
                      // Safety timeout: don't block forever
                      setTimeout(onceDone, 5000);
                    } else {
                      finishBoot();
                    }
                  }
                });
              }); // end preloadLangData().then
          })
          .catch(function (e) {
            console.error("[boot] Fatal:", e);
            showError(
              "Game failed to start",
              "The game couldn't start. Clearing the imported data and " +
                "re-importing the game folder usually fixes it.",
              e,
            );
          });
      })();
    </script>
  </body>
</html>
